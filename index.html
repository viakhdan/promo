<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)">
<title>Spark — find your match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f2f5;
    --ink: #1c1820;
    --muted: #8a8490;
    --yes: #ff3d6e;
    --yes-2: #ff7a45;
    --no: #6b6575;
    --btn: #ffffff;
    --btn-shadow: 0 6px 20px rgba(40, 20, 50, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121014; --surface: #1e1b22; --ink: #f4f1f6; --muted: #9a93a3;
      --no: #b8b0c2; --btn: #24202a; --btn-shadow: 0 6px 20px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121014; --surface: #1e1b22; --ink: #f4f1f6; --muted: #9a93a3;
    --no: #b8b0c2; --btn: #24202a; --btn-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior: none;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  .app {
    height: 100%;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    box-sizing: border-box;
  }
  .logo {
    background: linear-gradient(120deg, var(--yes), var(--yes-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card {
    position: absolute; inset: 0;
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
    touch-action: none;
    will-change: transform;
    box-shadow: 0 10px 30px rgba(30, 10, 40, .18);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .card .shade {
    position: absolute; inset: auto 0 0 0; height: 45%;
    background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0));
    pointer-events: none;
  }
  .action {
    display: grid; place-items: center;
    border-radius: 9999px;
    background: var(--btn);
    box-shadow: var(--btn-shadow);
    transition: transform .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .action:active { transform: scale(.9); }
  .action:focus-visible { outline: 3px solid var(--yes); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none !important; } }
</style>
</head>
<body>
<div class="app flex flex-col">

  <!-- Top bar -->
  <header class="flex items-center justify-between px-5 pt-2 pb-2">
    <button class="action w-10 h-10" aria-label="Profile" style="box-shadow:none;background:transparent">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
    <h1 class="logo text-[1.7rem] font-extrabold tracking-tight leading-none flex items-center gap-1">
      <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><path fill="url(#g)" d="M11 0c1 5 9 8 9 15a9 9 0 0 1-18 0c0-3 1.5-5 3.5-6.5C5.5 11 7 13 9 13 7 9 9 4 11 0Z"/></svg>
      spark
    </h1>
    <button class="action w-10 h-10" aria-label="Messages" style="box-shadow:none;background:transparent">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
    </button>
  </header>

  <!-- Card stack -->
  <main class="relative flex-1 mx-3 min-h-0">
    <div id="stack" class="absolute inset-0"></div>

    <div id="empty" class="absolute inset-0 hidden flex-col items-center justify-center text-center px-8 rounded-[22px]" style="background:var(--surface)">
      <p class="text-2xl font-bold mb-2">You’ve seen everyone nearby</p>
      <p class="mb-6" style="color:var(--muted)">Check back later, or start over to see these profiles again.</p>
      <button id="restart" class="px-6 py-3 rounded-full font-bold text-white" style="background:linear-gradient(120deg,var(--yes),var(--yes-2))">Start over</button>
    </div>
  </main>

  <!-- Hint -->
  <p class="text-center text-sm pt-3" style="color:var(--muted)">Swipe right for yes, left for no</p>

  <!-- Action buttons -->
  <nav class="flex items-center justify-center gap-8 pt-3 pb-4">
    <button id="btnNo" class="action w-16 h-16" aria-label="No">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--no)" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button id="btnYes" class="action w-[72px] h-[72px]" aria-label="Yes">
      <svg width="32" height="32" viewBox="0 0 24 24"><defs><linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><path fill="url(#h)" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z"/></svg>
    </button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-full text-white font-bold text-sm opacity-0 transition-opacity duration-300 pointer-events-none"
     style="top:calc(env(safe-area-inset-top, 0px) + 64px);background:linear-gradient(120deg,var(--yes),var(--yes-2))"></div>

  const stack = document.getElementById('stack');
  const empty = document.getElementById('empty');
  const toast = document.getElementById('toast');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;

  function cardHTML(p) {
    return `
      <img src="${p.img}" alt="${p.name}" style="object-position:${p.pos}" draggable="false">
      <div class="shade"></div>
      <div class="absolute left-0 right-0 bottom-0 p-5 text-white pointer-events-none">
        <div class="flex items-baseline gap-2">
          <span class="text-[2rem] font-extrabold leading-none">${p.name}</span>
          <span class="text-2xl font-medium leading-none">${p.age}</span>
          <span class="ml-1 w-2.5 h-2.5 rounded-full bg-[#2fe08a] self-center" aria-label="Active now"></span>
        </div>
        <div class="flex items-center gap-1.5 mt-2 text-[0.95rem] opacity-90">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
          ${p.distance}
        </div>
        <p class="mt-1.5 text-[0.95rem] opacity-90">${p.bio}</p>
      </div>`;
  }

  function render() {
    stack.innerHTML = '';
    empty.classList.add('hidden'); empty.classList.remove('flex');
    // Last in DOM = top card
    [...PROFILES].reverse().forEach((p, i, arr) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = cardHTML(p);
      el.dataset.name = p.name;
      const depth = arr.length - 1 - i;
      el.style.transform = `scale(${1 - depth * 0.04}) translateY(${depth * 14}px)`;
      stack.appendChild(el);
    });
    attach(topCard());
  }

  const topCard = () => stack.lastElementChild;

  function showToast(text) {
    toast.textContent = text;
    toast.style.opacity = 1;
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toast.style.opacity = 0, 1200);
  }

  // dir: +1 = right (YES), -1 = left (NO)
  function fling(card, dir) {
    if (!card || busy) return;
    busy = true;
    const w = window.innerWidth;
    card.style.transition = reduceMotion ? 'none' : 'transform .35s ease-out';
    card.style.transform = `translate(${dir * w * 1.4}px, -40px) rotate(${dir * 28}deg)`;
    if (dir > 0) showToast(`You liked ${card.dataset.name}`);
    if (navigator.vibrate) navigator.vibrate(10);
    setTimeout(() => {
      card.remove();
      busy = false;
      const next = topCard();
      if (next) {
        next.style.transition = reduceMotion ? 'none' : 'transform .25s ease';
        next.style.transform = 'none';
        attach(next);
      } else {
        empty.classList.remove('hidden'); empty.classList.add('flex');
      }
    }, reduceMotion ? 0 : 340);
  }

  function attach(card) {
    if (!card) return;
    card.style.transform = 'none';
    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;

    card.addEventListener('pointerdown', e => {
      if (busy) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY; dx = dy = 0;
      card.setPointerCapture(e.pointerId);
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      card.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx / 18}deg)`;
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      const threshold = Math.min(110, window.innerWidth * 0.28);
      if (Math.abs(dx) > threshold) {
        fling(card, dx > 0 ? 1 : -1);
      } else {
        card.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1.2)';
        card.style.transform = 'none';
      }
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }

  document.getElementById('btnYes').addEventListener('click', () => fling(topCard(), 1));
  document.getElementById('btnNo').addEventListener('click',  () => fling(topCard(), -1));
  document.getElementById('restart').addEventListener('click', render);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') fling(topCard(), 1);
    if (e.key === 'ArrowLeft') fling(topCard(), -1);
  });
  // Stop iOS Safari rubber-band scrolling and double-tap zoom
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());

  render();
</script>
